// ─── PRNG + MOCK SERIES/BOOK ──────────────────────────────────────────────────
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = a;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function buildSeriesMock(market, days = 90) {
  const rand = mulberry32(market.seed);
  const out = [];
  let v = Math.max(0.05, Math.min(0.95, market.yes - market.delta24 - 0.05 + rand() * 0.1));
  const jumps = [
    { day: Math.floor(days * 0.22), mag: (rand() - 0.5) * 0.18 },
    { day: Math.floor(days * 0.55), mag: (rand() - 0.5) * 0.14 },
    { day: Math.floor(days * 0.81), mag: (rand() - 0.4) * 0.16 },
  ];
  for (let d = 0; d < days; d++) {
    const noise = (rand() - 0.5) * 0.018;
    const drift = (market.yes - v) * 0.04;
    let jump = 0;
    for (const j of jumps) if (j.day === d) jump = j.mag;
    v = Math.max(0.02, Math.min(0.98, v + drift + noise + jump));
    out.push({ d, v, jump: jump !== 0 ? jump : null });
  }
  out[out.length - 1].v = market.yes;
  return out;
}
let _SERIES_MAP = {}, _BOOK_MAP = {};
function buildSeries(market, days = 90) { return _SERIES_MAP[market.id] || buildSeriesMock(market, days); }
function buildBook(market, depth = 8) {
  if (_BOOK_MAP[market.id]) return _BOOK_MAP[market.id];
  const rand = mulberry32(market.seed + 1);
  const mid = market.yes;
  const bids = [], asks = [];
  for (let i = 0; i < depth; i++) {
    bids.push({ p: Math.max(0.01, mid - 0.005 - i*0.005 - rand()*0.003), sz: Math.floor(2000 + rand()*18000) });
    asks.push({ p: Math.min(0.99, mid + 0.005 + i*0.005 + rand()*0.003), sz: Math.floor(2000 + rand()*18000) });
  }
  return { bids, asks, mid };
}

// ─── API HELPERS ─────────────────────────────────────────────────────────────
const _TAG_TO_CAT = { Politics:'Politics', Sports:'Sports', Crypto:'Crypto', Cryptocurrency:'Crypto', Science:'Tech', Technology:'Tech', Finance:'Macro', Economics:'Macro', Entertainment:'Culture', 'Pop Culture':'Culture', Business:'Macro', World:'Politics', Elections:'Politics' };
const _tryJ  = (s, fb) => { try { return JSON.parse(s); } catch { return fb; } };
const _clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const _fmtD  = iso => { try { return new Date(iso).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }); } catch { return '—'; } };

function _toMarket(m, i) {
  const prices = _tryJ(m.outcomePrices, ['0.5','0.5']);
  const tokens = _tryJ(m.clobTokenIds, []);
  const yes    = _clamp(parseFloat(prices[0]) || 0.5, 0.01, 0.99);
  const tag    = m.tags?.[0]?.label || '';
  return {
    id: m.conditionId, cat: _TAG_TO_CAT[tag] || tag || 'General',
    q: m.question || '', short: (m.groupItemTitle || m.question || '').slice(0, 55),
    yes, delta24: parseFloat(m.oneDayPriceChange) || 0,
    vol: parseFloat(m.volume24hr) || parseFloat(m.volume) || 0,
    liq: parseFloat(m.liquidityClob) || parseFloat(m.liquidity) || 0,
    closes: m.endDate ? _fmtD(m.endDate) : '—',
    seed: i * 7 + 3, conditionId: m.conditionId, yesTokenId: tokens[0] || null,
  };
}

function _buildSeriesFromHistory(raw, market, days = 90) {
  if (!raw?.length) return buildSeriesMock(market, days);
  const hist = [...raw].sort((a, b) => a.t - b.t);
  const nowTs = Date.now() / 1000, startTs = nowTs - days * 86400;
  const win = hist.filter(h => h.t >= startTs);
  if (win.length < 2) return buildSeriesMock(market, days);
  const out = [];
  for (let d = 0; d < days; d++) {
    const tgt = startTs + (d / (days - 1)) * (nowTs - startTs);
    let lo = win[0], hi = win[win.length - 1];
    for (let i = 0; i < win.length - 1; i++) {
      if (win[i].t <= tgt && win[i+1].t >= tgt) { lo = win[i]; hi = win[i+1]; break; }
    }
    const t = lo.t === hi.t ? 1 : (tgt - lo.t) / (hi.t - lo.t);
    out.push({ d, v: _clamp(lo.p + t * (hi.p - lo.p), 0.02, 0.98), jump: null });
  }
  for (let i = 1; i < out.length; i++) {
    const delta = out[i].v - out[i-1].v;
    if (Math.abs(delta) > 0.03) out[i].jump = delta;
  }
  out[out.length - 1].v = market.yes;
  return out;
}

function _detectNews(series, market) {
  if (!series) return [];
  return series
    .filter(p => p.jump !== null && Math.abs(p.jump) > 0.02)
    .sort((a, b) => Math.abs(b.jump) - Math.abs(a.jump))
    .slice(0, 3).sort((a, b) => a.d - b.d)
    .map(p => {
      const ago = (series.length - 1) - p.d;
      const t   = ago === 0 ? 'now' : ago < 2 ? '−1d' : ago < 7 ? `−${ago}d` : ago < 14 ? '−1w' : `−${Math.floor(ago/7)}w`;
      const dir = p.jump > 0 ? 'surged' : 'dropped';
      return { day: p.d, t, headline: `${market.short} probability ${dir} ${Math.abs(p.jump*100).toFixed(0)}pp`, impact: p.jump, src: 'Polymarket' };
    });
}

async function loadPolymarketData() {
  const raw = await fetch(`${GAMMA}/markets?active=true&closed=false&limit=20&order=volume24hr&ascending=false`).then(r => r.json());
  const markets = raw.filter(m => m.enableOrderBook && m.conditionId && m.clobTokenIds).slice(0, 8).map(_toMarket);
  if (!markets.length) throw new Error('no markets');
  const nowTs = Math.floor(Date.now() / 1000), startTs = nowTs - 90 * 86400;
  const [histories, books] = await Promise.all([
    Promise.all(markets.map(m =>
      fetch(`${CLOB}/prices-history?market=${m.conditionId}&startTs=${startTs}&endTs=${nowTs}&fidelity=60`)
        .then(r => r.json()).then(d => d.history || []).catch(() => [])
    )),
    Promise.all(markets.map(m =>
      m.yesTokenId
        ? fetch(`${CLOB}/book?token_id=${m.yesTokenId}`).then(r => r.json()).catch(() => null)
        : Promise.resolve(null)
    )),
  ]);
  const sm = {}, bm = {}, nm = {};
  markets.forEach((m, i) => {
    sm[m.id] = _buildSeriesFromHistory(histories[i], m);
    if (books[i]?.bids?.length && books[i]?.asks?.length) {
      const mapS = arr => arr.slice(0,8).map(e => ({ p: parseFloat(e.price), sz: parseFloat(e.size) })).filter(e => e.p > 0 && e.sz > 0);
      const bids = mapS(books[i].bids), asks = mapS(books[i].asks);
      if (bids.length && asks.length) bm[m.id] = { bids, asks, mid: (bids[0].p + asks[0].p) / 2 };
    }
    nm[m.id] = _detectNews(sm[m.id], m);
  });
  MARKETS = markets; _SERIES_MAP = sm; _BOOK_MAP = bm; NEWS_BY_MARKET = nm;
  TICKER_FEED = markets
    .filter(m => Math.abs(m.delta24) > 0.001)
    .sort((a, b) => Math.abs(b.delta24) - Math.abs(a.delta24))
    .map(m => ({ mkt: m.short, delta: m.delta24, reason: 'market activity', t: 'live' }));
}

// ─── FORMATTERS ───────────────────────────────────────────────────────────────
const fmtPp    = v => (v >= 0 ? '+' : '') + (v * 100).toFixed(1) + 'pp';
const fmtMoney = v => v >= 1e9 ? '$'+(v/1e9).toFixed(1)+'B' : v >= 1e6 ? '$'+(v/1e6).toFixed(1)+'M' : v >= 1e3 ? '$'+(v/1e3).toFixed(0)+'k' : '$'+v.toFixed(0);

// ─── HOOKS ────────────────────────────────────────────────────────────────────
function useTicker(hz = 1) {
  const [t, setT] = React.useState(0);
  React.useEffect(() => {
    const id = setInterval(() => setT(x => x + 1), 1000 / hz);
    return () => clearInterval(id);
  }, [hz]);
  return t;
}
function useLive(base, ampl = 0.003) {
  const t = useTicker(2);
  const j = Math.sin(t * 0.7 + base * 17) * ampl + Math.cos(t * 0.31 + base * 31) * ampl * 0.4;
  return Math.max(0.001, Math.min(0.999, base + j));
}
function useWindowSize() {
  const [sz, setSz] = React.useState({ w: window.innerWidth, h: window.innerHeight });
  React.useEffect(() => {
    const fn = () => setSz({ w: window.innerWidth, h: window.innerHeight });
    window.addEventListener('resize', fn);
    return () => window.removeEventListener('resize', fn);
  }, []);
  return sz;
}

// ─── RESPONSIVE CHART — uses viewBox so it scales with container ──────────────
function ProbChart({ market, series, news }) {
  const VW = 680, VH = 200;
  const pad = { l:36, r:16, t:18, b:22 };
  const w = VW - pad.l - pad.r, h = VH - pad.t - pad.b;
  const days = series.length;
  const x = d => pad.l + (d / (days - 1)) * w;
  const y = v => pad.t + (1 - v) * h;
  const path = series.map((p, i) => `${i?'L':'M'}${x(p.d).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const area = path + ` L${x(days-1).toFixed(1)},${y(0).toFixed(1)} L${x(0).toFixed(1)},${y(0).toFixed(1)} Z`;
  const pal  = { line:'#1a1612', area:'rgba(26,22,18,0.07)', grid:'rgba(26,22,18,0.08)', txt:'rgba(26,22,18,0.55)', up:'#0f6b3e', down:'#9a2a2a' };
  const safeNews = news || [];
  return (
    <svg width="100%" viewBox={`0 0 ${VW} ${VH}`} preserveAspectRatio="xMidYMid meet" style={{ display:'block' }}>
      {[0.25, 0.5, 0.75].map(g => (
        <g key={g}>
          <line x1={pad.l} x2={pad.l+w} y1={y(g)} y2={y(g)} stroke={pal.grid} strokeDasharray={g===0.5?'0':'2 4'} />
          <text x={pad.l-6} y={y(g)+3} fontSize="10" textAnchor="end" fill={pal.txt} style={{fontFamily:'JetBrains Mono, monospace'}}>{Math.round(g*100)}</text>
        </g>
      ))}
      <path d={area} fill={pal.area} />
      <path d={path} fill="none" stroke={pal.line} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" />
      {safeNews.map((n, i) => {
        const sx = x(n.day), sy = y(series[n.day]?.v ?? market.yes);
        const col = n.impact >= 0 ? pal.up : pal.down;
        return (
          <g key={i}>
            <line x1={sx} x2={sx} y1={sy} y2={pad.t} stroke={col} strokeOpacity="0.2" strokeDasharray="2 3" />
            <circle cx={sx} cy={sy} r="3.5" fill="#fff" stroke={col} strokeWidth="1.5" />
          </g>
        );
      })}
      <circle cx={x(days-1)} cy={y(series[series.length-1].v)} r="4"  fill={pal.line} />
      <circle cx={x(days-1)} cy={y(series[series.length-1].v)} r="9"  fill={pal.line} fillOpacity="0.15" />
      <text x={pad.l}   y={VH-4} fontSize="10" fill={pal.txt} style={{fontFamily:'JetBrains Mono, monospace'}}>−90d</text>
      <text x={pad.l+w} y={VH-4} fontSize="10" textAnchor="end" fill={pal.txt} style={{fontFamily:'JetBrains Mono, monospace'}}>now</text>
    </svg>
  );
}

function MiniSpark({ market }) {
  const series = React.useMemo(() => buildSeries(market), [market.id]);
  const color = market.delta24 >= 0 ? '#1d6b3a' : '#922424';
  const vals = series.map(p => p.v);
  const mn = Math.min(...vals), mx = Math.max(...vals), range = mx - mn || 0.01;
  const W = 280, H = 22;
  const path = vals.map((v, i) => `${i?'L':'M'}${(i/(vals.length-1))*W},${((mx-v)/range)*H}`).join(' ');
  return (
    <svg width="100%" height={H} viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
      <path d={path} fill="none" stroke={color} strokeWidth="1.2" strokeLinejoin="round" strokeLinecap="round" />
    </svg>
  );
}

    <div style={{ padding:isMobile?'14px 16px':'18px 24px 12px', borderBottom:`1px solid ${c.rule}` }}>
      <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', marginBottom:2 }}>
        <span style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:isMobile?18:22, fontStyle:'italic', letterSpacing:-0.3 }}>The Wire</span>
        <span style={{ fontFamily:'JetBrains Mono, monospace', fontSize:9, color:c.dim, textTransform:'uppercase', letterSpacing:1.4, display:'inline-flex', alignItems:'center', gap:6 }}>
          <span style={{ width:6, height:6, borderRadius:3, background:c.up, opacity:tick%2?1:0.5, transition:'opacity .4s' }} />
          Live
        </span>
      </div>
      <div style={{ fontFamily:'JetBrains Mono, monospace', fontSize:9, color:c.dim2, textTransform:'uppercase', letterSpacing:1.4, marginBottom:8 }}>Polymarket CLOB · streaming</div>
      {TICKER_FEED.slice(0, count).map((t, i) => (
        <div key={i} style={{ display:'grid', gridTemplateColumns:'32px 56px 1fr', columnGap:8, padding:'6px 0', borderBottom:i<count-1?`1px dotted ${c.rule}`:'none', alignItems:'baseline' }}>
          <span style={{ fontFamily:'JetBrains Mono, monospace', fontSize:10, color:c.dim }}>{t.t}</span>
          <span style={{ fontFamily:'JetBrains Mono, monospace', fontSize:11, color:t.delta>=0?c.up:c.down, fontWeight:600 }}>{fmtPp(t.delta)}</span>
          <div>
            <div style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:13, color:c.ink, lineHeight:1.2 }}>{t.mkt}</div>
            <div style={{ fontSize:10, color:c.dim, fontStyle:'italic', marginTop:1 }}>{t.reason}</div>
          </div>
        </div>
      ))}
    </div>
  );

  // ── Watchlist ──
  const Watchlist = ({ count = 4 }) => (
    <div style={{ padding:isMobile?'14px 16px':'14px 24px 8px' }}>
      <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', marginBottom:10 }}>
        <span style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:isMobile?16:18, fontStyle:'italic', letterSpacing:-0.2 }}>On the Watchlist</span>
        <span style={{ fontFamily:'JetBrains Mono, monospace', fontSize:9, color:c.dim, textTransform:'uppercase', letterSpacing:1.4 }}>{Math.min(count, MARKETS.length-1)} markets</span>
      </div>
      {MARKETS.slice(1, count+1).map((m, idx) => {
        const lv = useLive(m.yes, 0.002);
        const up = m.delta24 >= 0;
        return (
          <div key={m.id} style={{ padding:'7px 0', borderBottom:idx<count-1?`1px solid ${c.ruleSoft}`:'none' }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', gap:8 }}>
              <div style={{ flex:1, minWidth:0 }}>
                <Kicker color={c.dim} size={9}>{m.cat}</Kicker>
                <div style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:13, lineHeight:1.2, marginTop:2, color:c.ink, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{m.short}</div>
              </div>
              <div style={{ textAlign:'right', flexShrink:0 }}>
                <div style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:20, lineHeight:1, fontVariantNumeric:'tabular-nums' }}>{(lv*100).toFixed(0)}<span style={{ fontSize:10, color:c.dim }}>¢</span></div>
                <div style={{ fontSize:10, fontFamily:'JetBrains Mono, monospace', color:up?c.up:c.down, fontWeight:600 }}>{fmtPp(m.delta24)}</div>
              </div>
            </div>
            <div style={{ marginTop:3 }}><MiniSpark market={m} /></div>
          </div>
        );
      })}
    </div>
  );

  // ── Lead story body (headline + article + pull quote + chart) ──
  const LeadStory = () => (
    <div style={{ display:'flex', flexDirection:'column', gap:0 }}>
      <Kicker>{market.delta24 >= 0 ? '↗' : '↘'} Top Mover · {market.cat}</Kicker>
      <h1 style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontWeight:400, fontSize: isMobile ? (market.q.length>50?22:28) : isTablet ? (market.q.length>60?30:38) : (market.q.length>60?36:48), lineHeight:1.05, letterSpacing:-1, margin:'6px 0 4px', textWrap:'balance' }}>
        {market.q}
      </h1>
      <div style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:isMobile?13:15, fontStyle:'italic', color:c.dim, lineHeight:1.35, marginBottom:8 }}>
        {topNews ? `${topNews.headline}. The line sits at ${(market.yes*100).toFixed(0)}¢.` : `Market probability stands at ${(market.yes*100).toFixed(0)}¢ with ${fmtMoney(market.vol)} in 24h volume.`}
      </div>
      <div style={{ display:'flex', gap:10, flexWrap:'wrap', fontFamily:'JetBrains Mono, monospace', fontSize:10, color:c.dim, textTransform:'uppercase', letterSpacing:1.2, paddingBottom:10, borderBottom:`1px solid ${c.rule}` }}>
        <span>Markets Desk</span><span style={{ color:c.dim2 }}>·</span>
        <span>Updated {tick}s ago</span><span style={{ color:c.dim2 }}>·</span>
        <span>Resolves {market.closes}</span>
      </div>

      {/* On desktop/tablet: article text + stat block side by side; on mobile: stacked */}
      <div style={{ marginTop:12, display:'grid', gridTemplateColumns: isMobile ? '1fr' : '1.2fr 1fr', gap:isMobile?16:22 }}>
        <div style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:isMobile?13:14.5, lineHeight:1.55, color:c.body }}>
          {!isMobile && (
            <span style={{ float:'left', fontFamily:'"Instrument Serif", Georgia, serif', fontSize:56, lineHeight:0.85, paddingRight:8, paddingTop:4, color:c.ink, fontStyle:'italic' }}>
              {articleLead[0]}
            </span>
          )}
          {isMobile ? articleLead : articleLead.slice(1)}
        </div>
        <StatBlock />
      </div>

      {/* Pull quote */}
      <div style={{ borderTop:`1px solid ${c.ink}`, borderBottom:`1px solid ${c.ink}`, padding:'10px 0', margin:'12px 0', textAlign:'center' }}>
        <div style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:isMobile?14:17, fontStyle:'italic', lineHeight:1.3, color:c.ink, letterSpacing:-0.2 }}>{pullQuote}</div>
        <div style={{ fontFamily:'JetBrains Mono, monospace', fontSize:9, color:c.dim, textTransform:'uppercase', letterSpacing:1.6, marginTop:5 }}>— {pullSrc}</div>
      </div>

      {/* Chart */}
      <div>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:8 }}>
          <Kicker>Implied Probability · 90 Days</Kicker>
          <span style={{ fontFamily:'JetBrains Mono, monospace', fontSize:10, color:c.dim }}>Polymarket CLOB</span>
        </div>
        <ProbChart market={market} series={series} news={news} />
        {/* Annotations — only desktop has room for these */}
        {isDesktop && (
          <div style={{ position:'relative', height:0 }}>
            {news[0] && <div style={{ position:'absolute', top:-150, left:'15%', fontFamily:'"Instrument Serif", Georgia, serif', fontSize:11, fontStyle:'italic', color:c.dim, lineHeight:1.3, maxWidth:130 }}><span style={{ fontFamily:'JetBrains Mono, monospace', fontStyle:'normal', color:news[0].impact>=0?c.up:c.down, fontSize:9, marginRight:3 }}>1.</span>{news[0].headline}</div>}
            {news[2] && <div style={{ position:'absolute', top:-150, right:'2%', fontFamily:'"Instrument Serif", Georgia, serif', fontSize:11, fontStyle:'italic', color:c.dim, lineHeight:1.3, maxWidth:110, textAlign:'right' }}><span style={{ fontFamily:'JetBrains Mono, monospace', fontStyle:'normal', color:news[2].impact>=0?c.up:c.down, fontSize:9, marginRight:3 }}>3.</span>{news[2].headline}</div>}
          </div>
        )}
      </div>
    </div>
  );

  // ─── MOBILE: single scrollable column ─────────────────────────────────────
  if (isMobile) return (
    <div style={{ width:'100%', minHeight:'100vh', background:c.bg, color:c.ink, fontFamily:'Geist, system-ui, sans-serif', overflowY:'auto' }}>
      {/* Masthead */}
      <div style={{ padding:'14px 16px 0' }}>
        <div style={{ textAlign:'center', paddingBottom:8 }}>
          <div style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:36, lineHeight:1, letterSpacing:-0.8 }}>The <span style={{ fontStyle:'italic' }}>Forecast</span> Daily</div>
          <div style={{ fontFamily:'JetBrains Mono, monospace', fontSize:9, color:c.dim, textTransform:'uppercase', letterSpacing:1.6, marginTop:4 }}>{today}</div>
        </div>
        <Rule thick double />
      </div>
      {/* Ticker strip */}
      <div style={{ padding:'6px 16px', borderBottom:`1px solid ${c.rule}`, display:'flex', alignItems:'center', gap:12, overflowX:'auto', scrollbarWidth:'none' }}>
        <span style={{ fontFamily:'JetBrains Mono, monospace', color:c.accent, fontWeight:600, fontSize:9, textTransform:'uppercase', letterSpacing:1.6, flexShrink:0 }}>Live ·</span>
        {TICKER_FEED.slice(0,4).map((t, i) => (
          <span key={i} style={{ fontFamily:'JetBrains Mono, monospace', fontSize:10, color:t.delta>=0?c.up:c.down, flexShrink:0 }}>{t.mkt} {fmtPp(t.delta)}</span>
        ))}
        <span style={{ display:'inline-flex', alignItems:'center', gap:4, flexShrink:0 }}>
          <span style={{ width:5, height:5, borderRadius:'50%', background:c.up, opacity:tick%2?1:0.4, transition:'opacity .4s' }} />
        </span>
      </div>
      {/* Lead */}
      <div style={{ padding:'16px 16px' }}>
        <LeadStory />
      </div>
      {/* Wire */}
      <div style={{ borderTop:`1px solid ${c.rule}` }}>
        <Wire count={4} />
      </div>
      {/* Watchlist */}
      <div style={{ borderTop:`1px solid ${c.rule}` }}>
        <Watchlist count={3} />
      </div>
      {/* Footer */}
      <div style={{ borderTop:`2px solid ${c.ink}`, padding:'8px 16px', display:'flex', justifyContent:'space-between', fontSize:9, fontFamily:'JetBrains Mono, monospace', color:c.dim, textTransform:'uppercase', letterSpacing:1.2 }}>
        <span>Polymarket · Live</span>
        <span>{new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}</span>
      </div>
    </div>
  );

  // ─── TABLET: 2-column, no left rail, scrollable ───────────────────────────
  if (isTablet) return (
    <div style={{ width:'100%', height:'100%', background:c.bg, color:c.ink, fontFamily:'Geist, system-ui, sans-serif', display:'flex', flexDirection:'column', overflow:'hidden' }}>
      {/* Masthead */}
      <div style={{ padding:'12px 24px 0' }}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', paddingBottom:8 }}>
          <div style={{ fontFamily:'JetBrains Mono, monospace', fontSize:9, color:c.dim, textTransform:'uppercase', letterSpacing:1.4, lineHeight:1.5 }}>
            <div>{today}</div><div>polymarket.api · live</div>
          </div>
          <div style={{ textAlign:'center' }}>
            <div style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:38, lineHeight:0.95, letterSpacing:-0.8 }}>The <span style={{ fontStyle:'italic' }}>Forecast</span> Daily</div>
            <div style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:11, fontStyle:'italic', color:c.dim, marginTop:3 }}>"What the crowd believes today, priced to the cent."</div>
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:6, fontFamily:'JetBrains Mono, monospace', fontSize:9, color:c.dim, textTransform:'uppercase' }}>
            <span style={{ width:6, height:6, borderRadius:3, background:c.up, opacity:tick%2?1:0.4, transition:'opacity .4s' }} />
            <span>{MARKETS.length} live</span>
          </div>
        </div>
        <Rule thick double />
      </div>
      {/* Index strip — scrollable */}
      <div style={{ padding:'6px 24px', borderBottom:`1px solid ${c.rule}`, display:'flex', gap:16, overflowX:'auto', scrollbarWidth:'none', alignItems:'center' }}>
        <span style={{ fontFamily:'JetBrains Mono, monospace', color:c.accent, fontWeight:600, fontSize:9, textTransform:'uppercase', letterSpacing:1.6, flexShrink:0 }}>Index ·</span>
        {cats.map(cat => {
          const avg = catAvg(cat);
          const arrow = avg > 0.005 ? '↗' : avg < -0.005 ? '↘' : '→';
          return <span key={cat} style={{ fontFamily:'JetBrains Mono, monospace', fontSize:9, color:c.dim, textTransform:'uppercase', letterSpacing:1.2, flexShrink:0 }}><span style={{ color:c.ink }}>{cat}</span> {arrow} {Math.abs(avg*100).toFixed(1)}</span>;
        })}
        <span style={{ fontFamily:'JetBrains Mono, monospace', fontSize:9, color:c.ink, flexShrink:0 }}>OI {fmtMoney(MARKETS.reduce((s,m)=>s+m.liq,0))}</span>
      </div>
      {/* Body: 2-col */}
      <div style={{ flex:1, display:'grid', gridTemplateColumns:'1fr 280px', minHeight:0, overflow:'hidden' }}>
        <div style={{ padding:'16px 24px', overflowY:'auto', borderRight:`1px solid ${c.rule}` }}>
          <LeadStory />
        </div>
        <div style={{ display:'flex', flexDirection:'column', overflow:'hidden' }}>
          <div style={{ overflowY:'auto', flex:1 }}>
            <Wire count={5} />
            <Watchlist count={4} />
          </div>
        </div>
      </div>
      {/* Footer */}
      <div style={{ borderTop:`2px solid ${c.ink}`, padding:'6px 24px', display:'flex', justifyContent:'space-between', fontSize:9, fontFamily:'JetBrains Mono, monospace', color:c.dim, textTransform:'uppercase', letterSpacing:1.2 }}>
        <span>Live · Polymarket CLOB</span>
        <span>Updated {tick}s ago · {new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}</span>
      </div>
    </div>
  );

  // ─── DESKTOP: full 3-column, viewport-height ──────────────────────────────
  return (
    <div style={{ width:'100%', height:'100%', background:c.bg, color:c.ink, fontFamily:'Geist, system-ui, sans-serif', display:'flex', flexDirection:'column', overflow:'hidden' }}>
      {/* Masthead */}
      <div style={{ padding:'14px 32px 0' }}>
        <div style={{ display:'flex', alignItems:'flex-end', justifyContent:'space-between', paddingBottom:8 }}>
          <div style={{ fontFamily:'JetBrains Mono, monospace', fontSize:10, color:c.dim, textTransform:'uppercase', letterSpacing:1.6, lineHeight:1.5 }}>
            <div>{today}</div><div>New York · Established 2024</div>
          </div>
          <div style={{ textAlign:'center', flex:1 }}>
            <div style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:52, lineHeight:0.95, letterSpacing:-1.2 }}>The <span style={{ fontStyle:'italic' }}>Forecast</span> Daily</div>
            <div style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:12, fontStyle:'italic', color:c.dim, marginTop:4, letterSpacing:0.4 }}>"What the crowd believes today, priced to the cent." — Vol. III</div>
          </div>
          <div style={{ fontFamily:'JetBrains Mono, monospace', fontSize:10, color:c.dim, textTransform:'uppercase', letterSpacing:1.6, lineHeight:1.5, textAlign:'right' }}>
            <div>Single copy · 25¢</div><div>polymarket.api · live</div>
          </div>
        </div>
        <Rule thick double />
      </div>
      {/* Index strip */}
      <div style={{ padding:'8px 32px', borderBottom:`1px solid ${c.rule}`, display:'grid', gridTemplateColumns:'auto 1fr auto', gap:24, alignItems:'center' }}>
        <span style={{ fontFamily:'JetBrains Mono, monospace', color:c.accent, fontWeight:600, textTransform:'uppercase', letterSpacing:1.6, fontSize:10 }}>Index ·</span>
        <div style={{ display:'flex', gap:22, overflow:'hidden' }}>
          {cats.map(cat => {
            const avg = catAvg(cat);
            const arrow = avg > 0.005 ? '↗' : avg < -0.005 ? '↘' : '→';
            return <span key={cat} style={{ fontFamily:'JetBrains Mono, monospace', fontSize:10, color:c.dim, textTransform:'uppercase', letterSpacing:1.2, flexShrink:0 }}><span style={{ color:c.ink }}>{cat}</span> {arrow} {Math.abs(avg*100).toFixed(1)}</span>;
          })}
        </div>
        <div style={{ display:'flex', gap:16, alignItems:'center' }}>
          <span style={{ display:'inline-flex', alignItems:'center', gap:6, fontFamily:'JetBrains Mono, monospace', fontSize:10, textTransform:'uppercase', letterSpacing:1.2, color:c.dim }}>
            <span style={{ width:6, height:6, borderRadius:3, background:c.up, opacity:tick%2?1:0.4, transition:'opacity .4s' }} />
            {MARKETS.length} markets live
          </span>
          <span style={{ fontFamily:'JetBrains Mono, monospace', fontSize:10, color:c.ink }}>OI {fmtMoney(MARKETS.reduce((s,m)=>s+m.liq,0))}</span>
        </div>
      </div>
      {/* 3-column body */}
      <div style={{ flex:1, display:'grid', gridTemplateColumns:'160px 1fr 360px', minHeight:0, overflow:'hidden' }}>
        {/* Left rail */}
        <div style={{ borderRight:`1px solid ${c.rule}`, padding:'18px 16px 18px 32px', display:'flex', flexDirection:'column', gap:18, overflow:'hidden' }}>
          <div>
            <Kicker>Sections</Kicker>
            <div style={{ marginTop:8, fontFamily:'"Instrument Serif", Georgia, serif', fontSize:16, lineHeight:1.5 }}>
              {cats.map(n => {
                const on = n === market.cat;
                return (
                  <div key={n} style={{ color:on?c.ink:c.dim, fontStyle:on?'italic':'normal', borderBottom:`1px dotted ${c.ruleSoft}`, padding:'4px 0', display:'flex', justifyContent:'space-between' }}>
                    <span>{n}</span>
                    {on && <span style={{ fontFamily:'JetBrains Mono, monospace', fontSize:9, color:c.accent }}>→</span>}
                  </div>
                );
              })}
            </div>
          </div>
          <div>
            <Kicker color={c.gold}>The Briefing</Kicker>
            <div style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:12, fontStyle:'italic', color:c.body, marginTop:8, lineHeight:1.4 }}>Five markets the crowd is watching.</div>
            <ol style={{ margin:'8px 0 0', padding:'0 0 0 16px', fontSize:12, color:c.body, lineHeight:1.55 }}>
              {MARKETS.slice(0,5).map((m, i) => (
                <li key={i} style={{ marginBottom:5 }}>
                  <strong style={{ color:c.ink }}>{m.short}</strong>{' '}
                  <span style={{ fontFamily:'JetBrains Mono, monospace', fontSize:9, color:m.delta24>=0?c.up:c.down }}>{fmtPp(m.delta24)}</span>
                </li>
              ))}
            </ol>
          </div>
        </div>
        {/* Lead story — scrollable */}
        <div style={{ padding:'18px 28px', borderRight:`1px solid ${c.rule}`, overflowY:'auto' }}>
          <LeadStory />
        </div>
        {/* Right rail */}
        <div style={{ display:'flex', flexDirection:'column', overflow:'hidden' }}>
          <div style={{ overflowY:'auto', flex:1 }}>
            <Wire count={6} />
            <Watchlist count={4} />
          </div>
        </div>
      </div>
      {/* Footer */}
      <div style={{ borderTop:`2px solid ${c.ink}`, padding:'8px 32px', display:'flex', justifyContent:'space-between', fontSize:10, fontFamily:'JetBrains Mono, monospace', color:c.dim, textTransform:'uppercase', letterSpacing:1.4 }}>
        <span>Live · Polymarket CLOB</span>
        <span>gamma-api.polymarket.com · clob.polymarket.com</span>
        <span>Updated {tick}s ago · {new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}</span>
      </div>
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const [ready, setReady] = React.useState(false);
  React.useEffect(() => {
    loadPolymarketData()
      .catch(err => console.warn('[Polymarket] using mock data:', err.message))
      .finally(() => setReady(true));
  }, []);

  if (!ready) return (
    <div style={{ height:'100vh', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:12, background:'#f1ede4' }}>
      <div style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:32, fontStyle:'italic', letterSpacing:-0.5 }}>The <span style={{ fontStyle:'normal' }}>Forecast</span> Daily</div>
      <div style={{ fontFamily:'JetBrains Mono, monospace', fontSize:11, letterSpacing:2, color:'rgba(24,20,16,0.4)', textTransform:'uppercase' }}>Fetching live markets…</div>
      <div style={{ width:160, height:2, background:'rgba(24,20,16,0.1)', borderRadius:2, overflow:'hidden' }}>
        <div style={{ height:'100%', background:'rgba(24,20,16,0.35)', borderRadius:2, animation:'pm 1.4s ease-in-out infinite' }} />
      </div>
    </div>
  );

  return <Editorial />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
