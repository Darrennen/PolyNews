// ─── PRNG + mock series/book ──────────────────────────────────────────────────
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = a;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function buildSeriesMock(market, days = 90) {
  const rand = mulberry32(market.seed);
  const out = [];
  let v = Math.max(0.05, Math.min(0.95, market.yes - market.delta24 - 0.05 + rand() * 0.1));
  const jumps = [
    { day: Math.floor(days * 0.22), mag: (rand() - 0.5) * 0.18 },
    { day: Math.floor(days * 0.55), mag: (rand() - 0.5) * 0.14 },
    { day: Math.floor(days * 0.81), mag: (rand() - 0.4) * 0.16 },
  ];
  for (let d = 0; d < days; d++) {
    const noise = (rand() - 0.5) * 0.018;
    const drift = (market.yes - v) * 0.04;
    let jump = 0;
    for (const j of jumps) if (j.day === d) jump = j.mag;
    v = Math.max(0.02, Math.min(0.98, v + drift + noise + jump));
    out.push({ d, v, jump: jump !== 0 ? jump : null });
  }
  out[out.length - 1].v = market.yes;
  return out;
}
let _SERIES_MAP = {};
let _BOOK_MAP = {};
function buildSeries(market, days = 90) {
  return _SERIES_MAP[market.id] || buildSeriesMock(market, days);
}
function buildBook(market, depth = 8) {
  if (_BOOK_MAP[market.id]) return _BOOK_MAP[market.id];
  const rand = mulberry32(market.seed + 1);
  const mid = market.yes;
  const bids = [], asks = [];
  for (let i = 0; i < depth; i++) {
    bids.push({ p: Math.max(0.01, mid - 0.005 - i * 0.005 - rand() * 0.003), sz: Math.floor(2000 + rand() * 18000) });
    asks.push({ p: Math.min(0.99, mid + 0.005 + i * 0.005 + rand() * 0.003), sz: Math.floor(2000 + rand() * 18000) });
  }
  return { bids, asks, mid };
}

// ─── API HELPERS ─────────────────────────────────────────────────────────────
const _TAG_TO_CAT = { Politics:'Politics', Sports:'Sports', Crypto:'Crypto', Cryptocurrency:'Crypto', Science:'Tech', Technology:'Tech', Finance:'Macro', Economics:'Macro', Entertainment:'Culture', 'Pop Culture':'Culture', Business:'Macro', World:'Politics', Elections:'Politics' };
function _tryJ(s, fb) { try { return JSON.parse(s); } catch { return fb; } }
function _clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function _fmtD(iso) { try { return new Date(iso).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }); } catch { return '—'; } }

function _toMarket(m, i) {
  const prices = _tryJ(m.outcomePrices, ['0.5','0.5']);
  const tokens = _tryJ(m.clobTokenIds, []);
  const yes = _clamp(parseFloat(prices[0]) || 0.5, 0.01, 0.99);
  const tag = m.tags?.[0]?.label || '';
  return {
    id:          m.conditionId,
    cat:         _TAG_TO_CAT[tag] || tag || 'General',
    q:           m.question || '',
    short:       (m.groupItemTitle || m.question || '').slice(0, 55),
    yes,
    delta24:     parseFloat(m.oneDayPriceChange) || 0,
    vol:         parseFloat(m.volume24hr) || parseFloat(m.volume) || 0,
    liq:         parseFloat(m.liquidityClob) || parseFloat(m.liquidity) || 0,
    closes:      m.endDate ? _fmtD(m.endDate) : '—',
    seed:        i * 7 + 3,
    conditionId: m.conditionId,
    yesTokenId:  tokens[0] || null,
  };
}

function _buildSeriesFromHistory(raw, market, days = 90) {
  if (!raw?.length) return buildSeriesMock(market, days);
  const hist = [...raw].sort((a, b) => a.t - b.t);
  const nowTs = Date.now() / 1000;
  const startTs = nowTs - days * 86400;
  const win = hist.filter(h => h.t >= startTs);
  if (win.length < 2) return buildSeriesMock(market, days);
  const out = [];
  for (let d = 0; d < days; d++) {
    const tgt = startTs + (d / (days - 1)) * (nowTs - startTs);
    let lo = win[0], hi = win[win.length - 1];
    for (let i = 0; i < win.length - 1; i++) {
      if (win[i].t <= tgt && win[i+1].t >= tgt) { lo = win[i]; hi = win[i+1]; break; }
    }
    const t = lo.t === hi.t ? 1 : (tgt - lo.t) / (hi.t - lo.t);
    out.push({ d, v: _clamp(lo.p + t * (hi.p - lo.p), 0.02, 0.98), jump: null });
  }
  for (let i = 1; i < out.length; i++) {
    const delta = out[i].v - out[i-1].v;
    if (Math.abs(delta) > 0.03) out[i].jump = delta;
  }
  out[out.length - 1].v = market.yes;
  return out;
}

function _detectNews(series, market) {
  if (!series) return [];
  return series
    .filter(p => p.jump !== null && Math.abs(p.jump) > 0.02)
    .sort((a, b) => Math.abs(b.jump) - Math.abs(a.jump))
    .slice(0, 3)
    .sort((a, b) => a.d - b.d)
    .map(p => {
      const ago = (series.length - 1) - p.d;
      const t = ago === 0 ? 'now' : ago < 2 ? '−1d' : ago < 7 ? `−${ago}d` : ago < 14 ? '−1w' : `−${Math.floor(ago/7)}w`;
      const dir = p.jump > 0 ? 'surged' : 'dropped';
      return { day: p.d, t, headline: `${market.short} probability ${dir} ${Math.abs(p.jump*100).toFixed(0)}pp`, impact: p.jump, src: 'Polymarket' };
    });
}

async function loadPolymarketData() {
  const raw = await fetch(`${GAMMA}/markets?active=true&closed=false&limit=20&order=volume24hr&ascending=false`).then(r => r.json());
  const markets = raw.filter(m => m.enableOrderBook && m.conditionId && m.clobTokenIds).slice(0, 8).map(_toMarket);
  if (!markets.length) throw new Error('no markets');

  const nowTs = Math.floor(Date.now() / 1000);
  const startTs = nowTs - 90 * 86400;
  const [histories, books] = await Promise.all([
    Promise.all(markets.map(m =>
      fetch(`${CLOB}/prices-history?market=${m.conditionId}&startTs=${startTs}&endTs=${nowTs}&fidelity=60`)
        .then(r => r.json()).then(d => d.history || []).catch(() => [])
    )),
    Promise.all(markets.map(m =>
      m.yesTokenId
        ? fetch(`${CLOB}/book?token_id=${m.yesTokenId}`).then(r => r.json()).catch(() => null)
        : Promise.resolve(null)
    )),
  ]);

  const sm = {}, bm = {}, nm = {};
  markets.forEach((m, i) => {
    sm[m.id] = _buildSeriesFromHistory(histories[i], m);
    if (books[i]?.bids?.length && books[i]?.asks?.length) {
      const mapS = arr => arr.slice(0,8).map(e => ({ p: parseFloat(e.price), sz: parseFloat(e.size) })).filter(e => e.p > 0 && e.sz > 0);
      const bids = mapS(books[i].bids), asks = mapS(books[i].asks);
      if (bids.length && asks.length) bm[m.id] = { bids, asks, mid: (bids[0].p + asks[0].p) / 2 };
    }
    nm[m.id] = _detectNews(sm[m.id], m);
  });

  MARKETS = markets;
  _SERIES_MAP = sm;
  _BOOK_MAP = bm;
  NEWS_BY_MARKET = nm;
  TICKER_FEED = markets
    .filter(m => Math.abs(m.delta24) > 0.001)
    .sort((a, b) => Math.abs(b.delta24) - Math.abs(a.delta24))
    .map(m => ({ mkt: m.short, delta: m.delta24, reason: 'market activity', t: 'live' }));
}

// ─── SHARED PRIMITIVES ────────────────────────────────────────────────────────
const fmtPct = (v, d = 0) => (v * 100).toFixed(d) + '%';
const fmtPp = v => (v >= 0 ? '+' : '') + (v * 100).toFixed(1) + 'pp';
const fmtMoney = v => {
  if (v >= 1e9) return '$' + (v / 1e9).toFixed(1) + 'B';
  if (v >= 1e6) return '$' + (v / 1e6).toFixed(1) + 'M';
  if (v >= 1e3) return '$' + (v / 1e3).toFixed(0) + 'k';
  return '$' + v.toFixed(0);
};

function useTicker(hz = 1) {
  const [t, setT] = React.useState(0);
  React.useEffect(() => {
    const id = setInterval(() => setT(x => x + 1), 1000 / hz);
    return () => clearInterval(id);
  }, [hz]);
  return t;
}
function useLive(base, ampl = 0.003) {
  const t = useTicker(2);
  const j = Math.sin(t * 0.7 + base * 17) * ampl + Math.cos(t * 0.31 + base * 31) * ampl * 0.4;
  return Math.max(0.001, Math.min(0.999, base + j));
}

function ProbChart({ market, series, news, width = 600, height = 220, variant = 'editorial' }) {
  const pad = { l: 36, r: 16, t: 18, b: 22 };
  const w = width - pad.l - pad.r, h = height - pad.t - pad.b;
  const days = series.length;
  const x = d => pad.l + (d / (days - 1)) * w;
  const y = v => pad.t + (1 - v) * h;
  const path = series.map((p, i) => `${i ? 'L' : 'M'}${x(p.d).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const areaPath = path + ` L${x(series[series.length-1].d).toFixed(1)},${y(0).toFixed(1)} L${x(0).toFixed(1)},${y(0).toFixed(1)} Z`;
  const pal = { editorial: { line:'#1a1612', area:'rgba(26,22,18,0.07)', grid:'rgba(26,22,18,0.08)', txt:'rgba(26,22,18,0.55)', up:'#0f6b3e', down:'#9a2a2a' } }[variant] ||
              { line:'#1a1612', area:'rgba(26,22,18,0.07)', grid:'rgba(26,22,18,0.08)', txt:'rgba(26,22,18,0.55)', up:'#0f6b3e', down:'#9a2a2a' };
  const safeNews = news || [];
  return (
    <svg width={width} height={height} style={{ display:'block', overflow:'visible' }}>
      {[0.25, 0.5, 0.75].map(g => (
        <g key={g}>
          <line x1={pad.l} x2={pad.l+w} y1={y(g)} y2={y(g)} stroke={pal.grid} strokeDasharray={g===0.5?'0':'2 4'} />
          <text x={pad.l-6} y={y(g)+3} fontSize="10" textAnchor="end" fill={pal.txt} style={{fontFamily:'JetBrains Mono, monospace'}}>{Math.round(g*100)}</text>
        </g>
      ))}
      <path d={areaPath} fill={pal.area} />
      <path d={path} fill="none" stroke={pal.line} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" />
      {safeNews.map((n, i) => {
        const sx = x(n.day), sy = y(series[n.day]?.v ?? market.yes);
        const col = n.impact >= 0 ? pal.up : pal.down;
        return (
          <g key={i}>
            <line x1={sx} x2={sx} y1={sy} y2={pad.t} stroke={col} strokeOpacity="0.18" strokeDasharray="2 3" />
            <circle cx={sx} cy={sy} r="3.5" fill="#fff" stroke={col} strokeWidth="1.5" />
          </g>
        );
      })}
      <circle cx={x(days-1)} cy={y(series[series.length-1].v)} r="4" fill={pal.line} />
      <circle cx={x(days-1)} cy={y(series[series.length-1].v)} r="9" fill={pal.line} fillOpacity="0.15" />
      <text x={pad.l} y={height-4} fontSize="10" fill={pal.txt} style={{fontFamily:'JetBrains Mono, monospace'}}>−90d</text>
      <text x={pad.l+w} y={height-4} fontSize="10" textAnchor="end" fill={pal.txt} style={{fontFamily:'JetBrains Mono, monospace'}}>now</text>
    </svg>
  );
}

// ─── MINI SPARKLINE ───────────────────────────────────────────────────────────
function MiniSpark({ market }) {
  const series = React.useMemo(() => buildSeries(market), [market.id]);
  const up = market.delta24 >= 0;
  const color = up ? '#1d6b3a' : '#922424';
  const w = 280, h = 22;
  const vals = series.map(p => p.v);
  const mn = Math.min(...vals), mx = Math.max(...vals), range = mx - mn || 0.01;
  const path = vals.map((v, i) => `${i?'L':'M'}${(i/(vals.length-1))*w},${((mx-v)/range)*h}`).join(' ');
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      <path d={path} fill="none" stroke={color} strokeWidth="1.2" strokeLinejoin="round" strokeLinecap="round" />
    </svg>
  );
}

          </span>
          <span style={{ fontFamily:'JetBrains Mono, monospace', fontSize:10, color:c.ink }}>
            OI {fmtMoney(MARKETS.reduce((s,m)=>s+m.liq,0))}
          </span>
          <span style={{ padding:'3px 8px', border:`1px solid ${c.ink}`, fontFamily:'JetBrains Mono, monospace', fontSize:10, color:c.ink, textTransform:'uppercase', letterSpacing:1.2 }}>Polymarket</span>
        </div>
      </div>

      {/* BODY: 3-column */}
      <div style={{ flex:1, display:'grid', gridTemplateColumns:'160px 1fr 360px', minHeight:0 }}>

        {/* LEFT RAIL */}
        <div style={{ borderRight:`1px solid ${c.rule}`, padding:'18px 16px 18px 32px', display:'flex', flexDirection:'column', gap:18, minHeight:0 }}>
          <div>
            <Kicker>Sections</Kicker>
            <div style={{ marginTop:8, fontFamily:'"Instrument Serif", Georgia, serif', fontSize:16, lineHeight:1.5 }}>
              {cats.map(n => {
                const on = n === market.cat;
                return (
                  <div key={n} style={{ color:on?c.ink:c.dim, fontStyle:on?'italic':'normal', borderBottom:`1px dotted ${c.ruleSoft}`, padding:'4px 0', display:'flex', justifyContent:'space-between' }}>
                    <span>{n}</span>
                    {on && <span style={{ fontFamily:'JetBrains Mono, monospace', fontSize:9, color:c.accent }}>→</span>}
                  </div>
                );
              })}
            </div>
          </div>
          <div style={{ marginTop:4 }}>
            <Kicker color={c.gold}>The Briefing</Kicker>
            <div style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:13, lineHeight:1.45, color:c.body, marginTop:8, fontStyle:'italic' }}>
              Five markets the crowd is watching right now.
            </div>
            <ol style={{ margin:'10px 0 0', padding:'0 0 0 18px', fontSize:12, color:c.body, lineHeight:1.55 }}>
              {briefingItems.map((b, i) => (
                <li key={i} style={{ marginBottom:6 }}>
                  <strong style={{ color:c.ink }}>{b.highlight}</strong>{' '}
                  <span style={{ fontFamily:'JetBrains Mono, monospace', fontSize:10, color:b.up?c.up:c.down }}>{fmtPp(b.delta)}</span>
                </li>
              ))}
            </ol>
          </div>
        </div>

        {/* LEAD STORY */}
        <div style={{ padding:'18px 28px', borderRight:`1px solid ${c.rule}`, display:'flex', flexDirection:'column', minHeight:0, overflow:'hidden' }}>
          <Kicker>{market.delta24 >= 0 ? '↗' : '↘'} Top Mover · {market.cat}</Kicker>
          <h1 style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontWeight:400, fontSize:market.q.length > 60 ? 36 : 48, lineHeight:1.0, letterSpacing:-1.2, margin:'8px 0 4px', textWrap:'balance' }}>
            {market.q}
          </h1>
          <div style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:16, fontStyle:'italic', color:c.dim, lineHeight:1.35, margin:'6px 0 8px', maxWidth:640 }}>
            {topNews
              ? `${topNews.headline}. The line currently sits at ${(market.yes*100).toFixed(0)}¢.`
              : `Market probability stands at ${(market.yes*100).toFixed(0)}¢ with ${fmtMoney(market.vol)} in 24h volume.`}
          </div>
          <div style={{ display:'flex', gap:14, fontFamily:'JetBrains Mono, monospace', fontSize:10, color:c.dim, textTransform:'uppercase', letterSpacing:1.4, paddingBottom:10, borderBottom:`1px solid ${c.rule}` }}>
            <span>By the Markets Desk</span>
            <span style={{ color:c.dim2 }}>·</span>
            <span>Updated {tick}s ago</span>
            <span style={{ color:c.dim2 }}>·</span>
            <span>Resolves {market.closes}</span>
          </div>

          {/* Two-column body */}
          <div style={{ marginTop:12, display:'grid', gridTemplateColumns:'1.2fr 1fr', gap:22, minHeight:0 }}>
            {/* Lead with drop cap */}
            <div style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:14.5, lineHeight:1.55, color:c.body }}>
              <span style={{ float:'left', fontFamily:'"Instrument Serif", Georgia, serif', fontSize:64, lineHeight:0.85, paddingRight:8, paddingTop:4, color:c.ink, fontStyle:'italic' }}>
                {articleLead[0]}
              </span>
              {articleLead.slice(1)}
            </div>

            {/* Stat block */}
            <div style={{ display:'flex', flexDirection:'column', gap:0 }}>
              <div style={{ background:c.paper, border:`1px solid ${c.rule}`, padding:'14px 16px' }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline' }}>
                  <Kicker color={c.up}>Yes</Kicker>
                  <span style={{ fontFamily:'JetBrains Mono, monospace', fontSize:10, color:market.delta24>=0?c.up:c.down }}>{fmtPp(market.delta24)}</span>
                </div>
                <div style={{ display:'flex', alignItems:'baseline', gap:4, marginTop:2 }}>
                  <span style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:56, lineHeight:0.95, fontVariantNumeric:'tabular-nums', letterSpacing:-1.5 }}>{(live*100).toFixed(1)}</span>
                  <span style={{ fontSize:18, color:c.dim, fontFamily:'"Instrument Serif", Georgia, serif' }}>¢</span>
                </div>
                <div style={{ height:4, background:c.ruleSoft, marginTop:8, position:'relative' }}>
                  <div style={{ position:'absolute', left:0, top:0, bottom:0, width:live*100+'%', background:c.up }} />
                </div>
              </div>
              <div style={{ background:c.paper, borderLeft:`1px solid ${c.rule}`, borderRight:`1px solid ${c.rule}`, borderBottom:`1px solid ${c.rule}`, padding:'12px 16px', display:'flex', justifyContent:'space-between', alignItems:'baseline' }}>
                <Kicker color={c.down}>No</Kicker>
                <span style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:26, fontVariantNumeric:'tabular-nums' }}>{((1-live)*100).toFixed(1)}<span style={{ fontSize:12, color:c.dim }}>¢</span></span>
                <span style={{ fontFamily:'JetBrains Mono, monospace', fontSize:10, color:c.down }}>{fmtPp(-market.delta24)}</span>
              </div>
              <div style={{ marginTop:12, display:'grid', gridTemplateColumns:'1fr 1fr', gap:0, border:`1px solid ${c.rule}`, background:c.paper }}>
                {[
                  ['Vol 24h',   fmtMoney(market.vol)],
                  ['Liquidity', fmtMoney(market.liq)],
                  ['24h High',  (high24*100).toFixed(1)+'¢'],
                  ['24h Low',   (low24*100).toFixed(1)+'¢'],
                ].map(([l, v], i) => (
                  <div key={l} style={{ padding:'10px 12px', borderRight:i%2===0?`1px solid ${c.rule}`:'none', borderBottom:i<2?`1px solid ${c.rule}`:'none' }}>
                    <div style={{ fontFamily:'JetBrains Mono, monospace', fontSize:9, color:c.dim, textTransform:'uppercase', letterSpacing:1.4 }}>{l}</div>
                    <div style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:18, fontVariantNumeric:'tabular-nums', marginTop:2 }}>{v}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* Pull quote */}
          <div style={{ borderTop:`1px solid ${c.ink}`, borderBottom:`1px solid ${c.ink}`, padding:'10px 0', margin:'12px 0', textAlign:'center' }}>
            <div style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:18, fontStyle:'italic', lineHeight:1.3, color:c.ink, letterSpacing:-0.2 }}>
              {pullQuote}
            </div>
            <div style={{ fontFamily:'JetBrains Mono, monospace', fontSize:9, color:c.dim, textTransform:'uppercase', letterSpacing:1.6, marginTop:6 }}>
              — {pullSrc}
            </div>
          </div>

          {/* Hero chart */}
          <div style={{ position:'relative', flex:1, minHeight:0, display:'flex', flexDirection:'column' }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:8 }}>
              <Kicker>Implied Probability · 90 Days</Kicker>
              <div style={{ fontFamily:'JetBrains Mono, monospace', fontSize:10, color:c.dim }}>via Polymarket CLOB</div>
            </div>
            <div style={{ position:'relative', flex:1, minHeight:180 }}>
              <ProbChart market={market} series={series} news={news} variant="editorial" width={680} height={210} />
              {news[0] && (
                <div style={{ position:'absolute', top:6, left:Math.min(130, (news[0].day/90)*640), fontFamily:'"Instrument Serif", Georgia, serif', fontSize:11, fontStyle:'italic', color:c.dim, lineHeight:1.3, maxWidth:140 }}>
                  <span style={{ fontFamily:'JetBrains Mono, monospace', fontStyle:'normal', color:news[0].impact>=0?c.up:c.down, fontSize:9, marginRight:3 }}>1.</span>
                  {news[0].headline}
                </div>
              )}
              {news[1] && (
                <div style={{ position:'absolute', top:90, left:Math.min(320, (news[1].day/90)*640), fontFamily:'"Instrument Serif", Georgia, serif', fontSize:11, fontStyle:'italic', color:c.dim, lineHeight:1.3, maxWidth:130, textAlign:'center' }}>
                  <span style={{ fontFamily:'JetBrains Mono, monospace', fontStyle:'normal', color:news[1].impact>=0?c.up:c.down, fontSize:9, marginRight:3 }}>2.</span>
                  {news[1].headline}
                </div>
              )}
              {news[2] && (
                <div style={{ position:'absolute', top:6, right:8, fontFamily:'"Instrument Serif", Georgia, serif', fontSize:11, fontStyle:'italic', color:c.dim, lineHeight:1.3, maxWidth:110, textAlign:'right' }}>
                  <span style={{ fontFamily:'JetBrains Mono, monospace', fontStyle:'normal', color:news[2].impact>=0?c.up:c.down, fontSize:9, marginRight:3 }}>3.</span>
                  {news[2].headline}
                </div>
              )}
            </div>
          </div>
        </div>

        {/* RIGHT RAIL */}
        <div style={{ display:'flex', flexDirection:'column', minHeight:0 }}>
          {/* The Wire */}
          <div style={{ padding:'18px 24px 12px', borderBottom:`1px solid ${c.rule}` }}>
            <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', marginBottom:2 }}>
              <span style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:22, fontStyle:'italic', letterSpacing:-0.3 }}>The Wire</span>
              <span style={{ fontFamily:'JetBrains Mono, monospace', fontSize:9, color:c.dim, textTransform:'uppercase', letterSpacing:1.4, display:'inline-flex', alignItems:'center', gap:6 }}>
                <span style={{ width:6, height:6, borderRadius:3, background:c.up, opacity:tick%2?1:0.5, transition:'opacity .4s' }} />
                Live shifts
              </span>
            </div>
            <div style={{ fontFamily:'JetBrains Mono, monospace', fontSize:9, color:c.dim2, textTransform:'uppercase', letterSpacing:1.4, marginBottom:8 }}>
              Polymarket CLOB · streaming
            </div>
            {TICKER_FEED.slice(0, 6).map((t, i) => (
              <div key={i} style={{ display:'grid', gridTemplateColumns:'32px 56px 1fr', columnGap:8, padding:'7px 0', borderBottom:i<5?`1px dotted ${c.rule}`:'none', alignItems:'baseline' }}>
                <span style={{ fontFamily:'JetBrains Mono, monospace', fontSize:10, color:c.dim }}>{t.t}</span>
                <span style={{ fontFamily:'JetBrains Mono, monospace', fontSize:11, color:t.delta>=0?c.up:c.down, fontWeight:600 }}>{fmtPp(t.delta)}</span>
                <div>
                  <div style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:14, color:c.ink, lineHeight:1.2 }}>{t.mkt}</div>
                  <div style={{ fontSize:10, color:c.dim, fontStyle:'italic', marginTop:1 }}>{t.reason}</div>
                </div>
              </div>
            ))}
          </div>

          {/* Watchlist */}
          <div style={{ padding:'14px 24px 8px', flex:1, overflow:'hidden', display:'flex', flexDirection:'column' }}>
            <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', marginBottom:8 }}>
              <span style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:18, fontStyle:'italic', letterSpacing:-0.2 }}>On the Watchlist</span>
              <span style={{ fontFamily:'JetBrains Mono, monospace', fontSize:9, color:c.dim, textTransform:'uppercase', letterSpacing:1.4 }}>{Math.min(4, MARKETS.length-1)} markets</span>
            </div>
            {MARKETS.slice(1, 5).map((m, idx) => {
              const lv = useLive(m.yes, 0.002);
              const up = m.delta24 >= 0;
              return (
                <div key={m.id} style={{ padding:'8px 0', borderBottom:idx<3?`1px solid ${c.ruleSoft}`:'none' }}>
                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', gap:8 }}>
                    <div style={{ flex:1, minWidth:0 }}>
                      <Kicker color={c.dim}>{m.cat}</Kicker>
                      <div style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:14, lineHeight:1.2, marginTop:2, color:c.ink, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{m.short}</div>
                    </div>
                    <div style={{ textAlign:'right', flexShrink:0 }}>
                      <div style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:24, lineHeight:1, fontVariantNumeric:'tabular-nums', letterSpacing:-0.4 }}>{(lv*100).toFixed(0)}<span style={{ fontSize:11, color:c.dim }}>¢</span></div>
                      <div style={{ fontSize:10, fontFamily:'JetBrains Mono, monospace', color:up?c.up:c.down, marginTop:1, fontWeight:600 }}>{fmtPp(m.delta24)}</div>
                    </div>
                  </div>
                  <div style={{ marginTop:4 }}>
                    <MiniSpark market={m} />
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {/* FOOTER */}
      <div style={{ borderTop:`2px solid ${c.ink}`, padding:'8px 32px', display:'flex', justifyContent:'space-between', fontSize:10, fontFamily:'JetBrains Mono, monospace', color:c.dim, textTransform:'uppercase', letterSpacing:1.4, background:c.bg }}>
        <span>Live · Polymarket CLOB</span>
        <span>gamma-api.polymarket.com · clob.polymarket.com</span>
        <span>Updated {tick}s ago · {new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' })} local</span>
      </div>
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const [ready, setReady] = React.useState(false);

  React.useEffect(() => {
    loadPolymarketData()
      .catch(err => console.warn('[Polymarket] using mock data:', err.message))
      .finally(() => setReady(true));
  }, []);

  if (!ready) return (
    <div style={{ height:'100vh', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:12, background:'#f1ede4' }}>
      <div style={{ fontFamily:'"Instrument Serif", Georgia, serif', fontSize:32, fontStyle:'italic', letterSpacing:-0.5 }}>
        The <span style={{ fontStyle:'normal' }}>Forecast</span> Daily
      </div>
      <div style={{ fontFamily:'JetBrains Mono, monospace', fontSize:11, letterSpacing:2, color:'rgba(24,20,16,0.4)', textTransform:'uppercase' }}>
        Fetching live markets…
      </div>
      <div style={{ width:160, height:2, background:'rgba(24,20,16,0.1)', borderRadius:2, overflow:'hidden' }}>
        <div style={{ height:'100%', background:'rgba(24,20,16,0.35)', borderRadius:2, animation:'pm 1.4s ease-in-out infinite' }} />
      </div>
      <style>{`@keyframes pm{0%{width:0%;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0%;margin-left:100%}}`}</style>
    </div>
  );

  return <Editorial />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
